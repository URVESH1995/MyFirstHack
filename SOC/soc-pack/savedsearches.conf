action.notable.param.drilldown_name = All activity by $actor$
action.notable.param.drilldown_search = index=azure_ad OR index=wineventlog (initiatedBy.user.userPrincipalName="$actor$" OR Subject_Account_Name="$actor$") | table _time, index, operationName, EventCode, targetResources{}.userPrincipalName, Member_Name
action.notable.param.drilldown_earliest_offset = 604800
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"target","risk_object_type":"user","risk_score":50},{"risk_object_field":"actor","risk_object_type":"user","risk_score":40}]
action.risk.param._risk_message = $target$ added to privileged group $group$ by $actor$
alert.suppress = 1
alert.suppress.fields = target,group
alert.suppress.period = 1h
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


##############################################################################
# PB-10 · DATA EXFILTRATION
##############################################################################

[Exfiltration - Anomalous Outbound Volume To Personal Cloud Storage - Rule]
description = Detects a user uploading more than 1 GB to an unsanctioned personal cloud storage service in 24 hours. Involve HR and Legal before investigating a named employee - follow your internal investigation authorization process. Playbook PB-10.
search = | tstats summariesonly=true allow_old_summaries=true sum(Web.bytes_out) as bytes_out count\
    from datamodel=Web\
    where Web.action!="blocked"\
    by Web.user Web.src Web.site\
| rename "Web.*" as "*"\
| lookup personal_cloud_storage.csv domain as site OUTPUT service, sanctioned\
| where isnotnull(service) AND sanctioned!="true"\
| stats sum(bytes_out) as bytes_out sum(count) as requests values(site) as sites\
        values(service) as services by user, src\
| eval GB_out=round(bytes_out/1024/1024/1024,2)\
| where GB_out >= 1\
| sort - GB_out\
| table user, src, GB_out, requests, services, sites
action.correlationsearch.enabled = 1
action.correlationsearch.label = Exfiltration - Anomalous Outbound Volume To Personal Cloud Storage
action.correlationsearch.annotations = {"mitre_attack":["T1567.002","T1048"],"kill_chain_phases":["Exfiltration"],"nist":["DE.CM-1","PR.DS-5"]}
action.notable = 1
action.notable.param.rule_title = Data upload to personal cloud - $user$ sent $GB_out$ GB to $services$
action.notable.param.rule_description = $user$ uploaded $GB_out$ GB to unsanctioned service $services$ from $src$. Preserve evidence before any user contact. Engage HR and Legal before investigating the individual. Playbook PB-10.
action.notable.param.security_domain = network
action.notable.param.severity = high
action.notable.param.nes_fields = user,src
action.notable.param.drilldown_name = Full web activity for $user$
action.notable.param.drilldown_search = | tstats summariesonly=false sum(Web.bytes_out) as bytes_out from datamodel=Web where Web.user="$user$" by Web.site | rename "Web.*" as "*" | sort - bytes_out
action.notable.param.drilldown_earliest_offset = 604800
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":70}]
action.risk.param._risk_message = $user$ uploaded $GB_out$ GB to $services$
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 24h
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = 15 6 * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


