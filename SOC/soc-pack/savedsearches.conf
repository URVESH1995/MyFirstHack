[Network - DNS Tunneling Indicators - Rule]
description = Detects DNS tunnelling based on high unique-subdomain volume, long query names, and high entropy against a single parent domain. Playbook PB-06. Expect false positives from CDNs, antivirus reputation lookups, and telemetry - allowlist by parent domain.
search = | tstats summariesonly=true allow_old_summaries=true count\
    from datamodel=Network_Resolution\
    where DNS.message_type="QUERY"\
    by DNS.src DNS.query\
| rename "DNS.*" as "*"\
| eval qlen=len(query)\
| rex field=query "(?<parent_domain>[a-zA-Z0-9\-]+\.[a-zA-Z]{2,}$)"\
| eval subdomain=replace(query,"\.".parent_domain."$","")\
| eval digits=len(replace(subdomain,"[^0-9]","")), alpha=len(replace(subdomain,"[^a-zA-Z]",""))\
| eval entropy_proxy=if(alpha>0,round(digits/alpha,2),9)\
| stats dc(query) as unique_queries sum(count) as total_queries avg(qlen) as avg_qlen\
        max(qlen) as max_qlen avg(entropy_proxy) as avg_entropy\
        by src, parent_domain\
| lookup beacon_allowlist.csv dest as parent_domain OUTPUT description as known_good\
| where isnull(known_good)\
| where unique_queries >= 300 AND avg_qlen >= 40\
| eval avg_qlen=round(avg_qlen,1), avg_entropy=round(avg_entropy,2)\
| sort - unique_queries\
| table src, parent_domain, unique_queries, total_queries, avg_qlen, max_qlen, avg_entropy
action.correlationsearch.enabled = 1
action.correlationsearch.label = Network - DNS Tunneling Indicators
action.correlationsearch.annotations = {"mitre_attack":["T1071.004","T1048.003"],"kill_chain_phases":["Command and Control","Exfiltration"],"nist":["DE.CM-1"]}
action.notable = 1
action.notable.param.rule_title = Possible DNS tunneling - $src$ to $parent_domain$
action.notable.param.rule_description = $src$ issued $unique_queries$ unique subdomain queries under $parent_domain$ averaging $avg_qlen$ characters. Consistent with DNS tunnelling for C2 or exfiltration. Check the resolving process and block the parent domain at the resolver.
action.notable.param.security_domain = network
action.notable.param.severity = high
action.notable.param.nes_fields = src,parent_domain
action.notable.param.drilldown_name = DNS queries from $src$ to $parent_domain$
action.notable.param.drilldown_search = | tstats summariesonly=false count from datamodel=Network_Resolution where DNS.src="$src$" DNS.query="*$parent_domain$" by DNS.query | rename "DNS.*" as "*" | sort - count
action.notable.param.drilldown_earliest_offset = 86400
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":70}]
action.risk.param._risk_message = DNS tunnelling indicators from $src$ to $parent_domain$
