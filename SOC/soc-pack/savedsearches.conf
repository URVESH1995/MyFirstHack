[Endpoint - Suspicious Encoded PowerShell Execution - Rule]
description = Detects PowerShell executed with encoding, download, or execution-policy-bypass switches. Exclude your own management tooling by parent process and signed script path, not by process name. Playbook PB-07.
search = | tstats summariesonly=true allow_old_summaries=true count\
    min(_time) as firstTime max(_time) as lastTime\
    from datamodel=Endpoint.Processes\
    where Processes.process_name IN ("powershell.exe","pwsh.exe","powershell_ise.exe")\
    by Processes.dest Processes.user Processes.process Processes.parent_process_name Processes.parent_process\
| rename "Processes.*" as "*"\
| eval cmd=lower(process)\
| eval score=0\
| eval score=score+if(match(cmd,"\s-e(nc|ncodedcommand|c)?\s"),3,0)\
| eval score=score+if(match(cmd,"frombase64string"),3,0)\
| eval score=score+if(match(cmd,"downloadstring|downloadfile|invoke-webrequest|invoke-restmethod|net\.webclient|start-bitstransfer"),2,0)\
| eval score=score+if(match(cmd,"-w(indowstyle)?\s+hidden|-nop|-noni|-noprofile"),1,0)\
| eval score=score+if(match(cmd,"bypass|unrestricted"),1,0)\
| eval score=score+if(match(cmd,"iex|invoke-expression"),2,0)\
| eval score=score+if(match(cmd,"reflection\.assembly|virtualalloc|createthread|memorystream|deflatestream"),3,0)\
| eval score=score+if(match(cmd,"-s(ta|ec)?\s|hidden\s+-e"),1,0)\
| eval score=score+if(match(lower(parent_process_name),"winword|excel|powerpnt|outlook|mshta|wscript|cscript"),3,0)\
| where score >= 5\
| eval firstTime=strftime(firstTime,"%F %T"), lastTime=strftime(lastTime,"%F %T")\
| table firstTime, lastTime, dest, user, score, parent_process_name, process, count
