action.notable.param.drilldown_earliest_offset = 86400
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":70}]
action.risk.param._risk_message = Beacon-like traffic from $src$ to $dest$
alert.suppress = 1
alert.suppress.fields = src,dest
alert.suppress.period = 24h
