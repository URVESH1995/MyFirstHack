##############################################################################
# savedsearches.conf
# SOC Correlation Searches — Splunk Cloud + Enterprise Security
# Companion to soc-incident-response-playbooks.md
# Version 1.0
#
# -------------------------------------------------------------------------
# DEPLOYMENT ON SPLUNK CLOUD — READ THIS FIRST
# -------------------------------------------------------------------------
# You cannot edit .conf files directly on Splunk Cloud (no filesystem access).
# Three supported paths:
#
#   1. PRIVATE APP (recommended for version control)
#      Package as:  my_soc_correlation_searches/
#                     default/savedsearches.conf   <- this file
#                     default/app.conf
#                     metadata/default.meta
#      Then: Splunk Cloud Admin Console -> Apps -> Install app from file.
#      It goes through AppInspect vetting (usually minutes for conf-only apps).
#      Set in default.meta:
#        [savedsearches]
#        export = system
#        owner = nobody
#
#   2. ES CONTENT MANAGEMENT UI (fastest for one-offs)
#      ES -> Configure -> Content -> Content Management -> Create New Content
#      -> Correlation Search. Paste the `search` value and set the notable /
#      risk / annotation fields to match the stanza below.
#
#   3. REST API (good for CI/CD)
#      curl -k -u user:pass https://<stack>.splunkcloud.com:8089/servicesNS/nobody/SplunkEnterpriseSecuritySuite/saved/searches \
#        -d name="<stanza name>" -d search="<spl>" -d action.correlationsearch.enabled=1 ...
#
# -------------------------------------------------------------------------
# EVERY SEARCH SHIPS WITH  disabled = 1  ON PURPOSE
# -------------------------------------------------------------------------
# Enable one at a time, in this order:
#   a) Run the `search` value manually over -7d. Count the results.
#   b) If >20 results/day, it needs tuning BEFORE you enable it. A rule that
#      fires 200 times a day trains analysts to ignore it, which is worse
#      than having no rule.
#   c) Populate the required lookups (below) first — most of the noise
#      reduction lives there.
#   d) Enable, watch for 5 business days, then adjust thresholds.
#
# -------------------------------------------------------------------------
# REQUIRED LOOKUPS — create these before enabling
# -------------------------------------------------------------------------
#   corporate_ip_ranges.csv        cidr, description, site
#   corporate_asn.csv              asn, asn_name
#   phishing_simulation_senders.csv sender_domain, platform, notes
#   redteam_infrastructure.csv     ip, engagement_ref, valid_until
#   personal_cloud_storage.csv     domain, service, sanctioned(true|false)
#   rmm_tools.csv                  process_name, tool_name, approved(true|false)
#   beacon_allowlist.csv           dest, description   # update agents, telemetry
#   privileged_groups.csv          group_name, tier
#   expected_admin_hosts.csv       dest, user, justification
#
# -------------------------------------------------------------------------
# INDEX / SOURCETYPE ASSUMPTIONS — CHANGE THESE
# -------------------------------------------------------------------------
#   index=azure_ad    sourcetype=azure:aad:signin / azure:aad:audit
#                     (Splunk Add-on for Microsoft Cloud Services)
#   index=o365        sourcetype=o365:management:activity
#   index=defender    Microsoft 365 Defender add-on / Event Hub streaming
#   index=proxy       CIM Web data model compliant
#   index=dns         CIM Network Resolution compliant
#   index=firewall    CIM Network Traffic compliant
#   Endpoint process data: assumed available via the CIM Endpoint data model
#   (Sysmon via Splunk Add-on for Sysmon, or MDE advanced hunting export).
#   Verify with:  | tstats count from datamodel=Endpoint.Processes by index
#   If the Endpoint data model is not accelerated, swap `summariesonly=true`
#   to `false` and expect slower searches, or rewrite as a raw search.
#
#   Sanity check what you actually have before anything else:
#     | tstats count where index=* by index, sourcetype | sort - count
#
# -------------------------------------------------------------------------
# NOTES ON RISK-BASED ALERTING (RBA)
# -------------------------------------------------------------------------
# Searches marked RISK-ONLY contribute to a risk score rather than creating
# a notable directly. They are individually too noisy to be notables but
# valuable in aggregate. Pair them with an ES risk-threshold correlation
# search ("Risk Threshold Exceeded For Object Over 24 Hours"). If you are not
# running RBA, set action.notable = 1 on them and expect more volume.
##############################################################################


##############################################################################
# PB-01 · PHISHING
##############################################################################

[Phishing - Credential Submission Following Malicious URL Click - Rule]
description = Correlates a click on a URL from a message flagged as phishing with a subsequent successful sign-in for the same user from an IP outside corporate ranges within 4 hours. Strong indicator that credentials were captured and used, including via adversary-in-the-middle session theft. Playbook PB-01 Branch C.
search = index=defender sourcetype="ms:defender:incident:alerts" (category="Phishing" OR title="*malicious URL*" OR title="*clicked through*")\
| rename entities.AccountUpn as user, entities.Url as phish_url\
| eval click_time=_time\
| fields user, phish_url, click_time\
| join type=inner user\
    [ search index=azure_ad sourcetype="azure:aad:signin" "status.errorCode"=0 earliest=-4h\
    | rename userPrincipalName as user, ipAddress as src_ip\
    | lookup corporate_ip_ranges.csv cidr as src_ip OUTPUT description as corp_site\
    | where isnull(corp_site)\
    | eval signin_time=_time\
    | fields user, src_ip, signin_time, appDisplayName, userAgent, authenticationRequirement, "location.countryOrRegion" ]\
| where signin_time > click_time AND (signin_time - click_time) < 14400\
| eval delta_minutes=round((signin_time-click_time)/60,1)\
| table click_time, signin_time, delta_minutes, user, phish_url, src_ip, location.countryOrRegion, appDisplayName, authenticationRequirement, userAgent
action.correlationsearch.enabled = 1
action.correlationsearch.label = Phishing - Credential Submission Following Malicious URL Click
action.correlationsearch.annotations = {"mitre_attack":["T1566.002","T1078.004","T1539"],"kill_chain_phases":["Delivery","Exploitation"],"nist":["DE.CM-1","DE.AE-2"]}
action.notable = 1
action.notable.param.rule_title = Probable credential compromise - $user$ signed in from $src_ip$ after phishing click
action.notable.param.rule_description = User $user$ clicked $phish_url$ and authenticated successfully from non-corporate IP $src_ip$ ($location.countryOrRegion$) $delta_minutes$ minutes later. Treat as account compromise. Revoke sessions before further investigation.
action.notable.param.security_domain = access
action.notable.param.severity = high
action.notable.param.nes_fields = user,src_ip
action.notable.param.default_owner = unassigned
action.notable.param.default_status = 1
action.notable.param.drilldown_name = All authentication for $user$ (last 7 days)
action.notable.param.drilldown_search = index=azure_ad sourcetype="azure:aad:signin" userPrincipalName="$user$" | table _time, ipAddress, location.countryOrRegion, appDisplayName, status.errorCode, authenticationRequirement, conditionalAccessStatus
action.notable.param.drilldown_earliest_offset = 604800
action.notable.param.drilldown_latest_offset = 0
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":80}]
action.risk.param._risk_message = $user$ authenticated from $src_ip$ following a malicious URL click
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 4h
alert.digest_mode = 0
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time = now
enableSched = 1
schedule_window = auto
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


[Phishing - Mass Campaign Delivered To Inbox - Rule]
description = Detects a phishing campaign where 5 or more messages from the same sender or with the same subject were delivered to the Inbox (not quarantined). Excludes known simulation senders. Playbook PB-01 Branch B.
search = index=defender sourcetype="ms:defender:email:events" DeliveryLocation="Inbox*" (ThreatTypes="Phish*" OR ThreatTypes="*Malware*" OR DetectionMethods="*")\
| lookup phishing_simulation_senders.csv sender_domain as SenderMailFromDomain OUTPUT platform\
| where isnull(platform)\
| stats count dc(RecipientEmailAddress) as recipient_count\
        values(RecipientEmailAddress) as recipients\
        values(Subject) as subjects\
        values(SenderFromAddress) as senders\
        min(_time) as firstTime max(_time) as lastTime\
        by SenderMailFromDomain, SenderIPv4\
| where recipient_count >= 5\
| eval firstTime=strftime(firstTime,"%F %T"), lastTime=strftime(lastTime,"%F %T")\
| table firstTime, lastTime, SenderMailFromDomain, SenderIPv4, senders, recipient_count, recipients, subjects
action.correlationsearch.enabled = 1
action.correlationsearch.label = Phishing - Mass Campaign Delivered To Inbox
action.correlationsearch.annotations = {"mitre_attack":["T1566.001","T1566.002"],"kill_chain_phases":["Delivery"],"nist":["DE.CM-1"]}
action.notable = 1
action.notable.param.rule_title = Phishing campaign delivered - $recipient_count$ inboxes from $SenderMailFromDomain$
action.notable.param.rule_description = $recipient_count$ malicious messages from $SenderMailFromDomain$ ($SenderIPv4$) reached user inboxes. Purge via Defender Explorer and check for clicks. See runbook PB-01 section 6.1.
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.nes_fields = SenderMailFromDomain,SenderIPv4
action.notable.param.drilldown_name = All mail from $SenderMailFromDomain$ (30 days)
action.notable.param.drilldown_search = index=defender sourcetype="ms:defender:email:events" SenderMailFromDomain="$SenderMailFromDomain$" | table _time, NetworkMessageId, SenderFromAddress, RecipientEmailAddress, Subject, DeliveryAction, DeliveryLocation
action.notable.param.drilldown_earliest_offset = 2592000
alert.suppress = 1
alert.suppress.fields = SenderMailFromDomain
alert.suppress.period = 12h
alert.digest_mode = 0
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = 10,40 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


[Phishing - Outbound Internal Phishing From Corporate Account - Rule]
description = Detects a corporate mailbox sending a high volume of messages with identical subjects, indicating a compromised account being used to spread phishing internally or to external parties. High urgency - abuses trust relationships and bypasses perimeter controls. Playbook PB-01 section 7.
search = index=defender sourcetype="ms:defender:email:events" (EmailDirection="Outbound" OR EmailDirection="Intra-org")\
| bin _time span=1h\
| stats dc(RecipientEmailAddress) as recipient_count values(Subject) as subjects\
        dc(Subject) as subject_variants sum(eval(if(EmailDirection=="Outbound",1,0))) as external_count\
        by _time, SenderFromAddress\
| where recipient_count >= 25 AND subject_variants <= 3\
| table _time, SenderFromAddress, recipient_count, external_count, subject_variants, subjects
action.correlationsearch.enabled = 1
action.correlationsearch.label = Phishing - Outbound Internal Phishing From Corporate Account
action.correlationsearch.annotations = {"mitre_attack":["T1534","T1078.004"],"kill_chain_phases":["Delivery","Lateral Movement"],"nist":["DE.CM-1"]}
action.notable = 1
action.notable.param.rule_title = Compromised mailbox sending bulk mail - $SenderFromAddress$ to $recipient_count$ recipients
action.notable.param.rule_description = $SenderFromAddress$ sent to $recipient_count$ recipients ($external_count$ external) in one hour with only $subject_variants$ distinct subjects. Contain the identity immediately, purge outbound mail, and check for payment-change requests in Sent Items.
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.nes_fields = SenderFromAddress
action.notable.param.drilldown_name = Sent mail and mailbox rule changes for $SenderFromAddress$
action.notable.param.drilldown_search = index=o365 sourcetype="o365:management:activity" UserId="$SenderFromAddress$" | table _time, Operation, ClientIP, ObjectId, Parameters
action.notable.param.drilldown_earliest_offset = 604800
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"SenderFromAddress","risk_object_type":"user","risk_score":90}]
action.risk.param._risk_message = $SenderFromAddress$ sending bulk mail to $recipient_count$ recipients
alert.suppress = 1
alert.suppress.fields = SenderFromAddress
alert.suppress.period = 6h
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = */20 * * * *
dispatch.earliest_time = -80m@h
dispatch.latest_time = @h
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


##############################################################################
# PB-04 / PB-05 · IDENTITY AND ACCESS
##############################################################################

[Access - Password Spray Against Multiple Accounts - Rule]
description = Detects a single source IP producing invalid-credential or lockout errors against 10 or more distinct accounts within one hour. Playbook PB-05. Error codes - 50126 invalid credentials, 50053 smart lockout, 50055 expired password, 50056 invalid or null password.
search = index=azure_ad sourcetype="azure:aad:signin" "status.errorCode" IN (50126, 50053, 50055, 50056, 50076)\
| rename ipAddress as src_ip, userPrincipalName as user\
| lookup corporate_ip_ranges.csv cidr as src_ip OUTPUT description as corp_site\
| stats dc(user) as unique_users count as attempts\
        values(user) as targeted_users values(status.errorCode) as error_codes\
        values(appDisplayName) as apps values(corp_site) as corp_site\
        min(_time) as firstTime max(_time) as lastTime\
        by src_ip\
| where unique_users >= 10\
| eval firstTime=strftime(firstTime,"%F %T"), lastTime=strftime(lastTime,"%F %T")\
| eval internal=if(isnull(mvindex(corp_site,0)),"external","INTERNAL - possible compromised host")\
| table firstTime, lastTime, src_ip, internal, unique_users, attempts, error_codes, apps, targeted_users
action.correlationsearch.enabled = 1
action.correlationsearch.label = Access - Password Spray Against Multiple Accounts
action.correlationsearch.annotations = {"mitre_attack":["T1110.003","T1110.001"],"kill_chain_phases":["Exploitation"],"nist":["DE.CM-1","PR.AC-7"]}
action.notable = 1
action.notable.param.rule_title = Password spray from $src_ip$ against $unique_users$ accounts
action.notable.param.rule_description = $src_ip$ ($internal$) attempted authentication against $unique_users$ distinct accounts ($attempts$ attempts). Check for any success from this source before closing. An INTERNAL source means a compromised host, not an external attacker.
action.notable.param.security_domain = access
action.notable.param.severity = medium
action.notable.param.nes_fields = src_ip
action.notable.param.drilldown_name = All authentication from $src_ip$ including successes
action.notable.param.drilldown_search = index=azure_ad sourcetype="azure:aad:signin" ipAddress="$src_ip$" | stats count by userPrincipalName, status.errorCode, appDisplayName | sort - count
action.notable.param.drilldown_earliest_offset = 86400
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src_ip","risk_object_type":"system","risk_score":50}]
action.risk.param._risk_message = Password spray from $src_ip$ against $unique_users$ accounts
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 6h
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = 15 * * * *
dispatch.earliest_time = -75m@m
dispatch.latest_time = -15m@m
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


[Access - Successful Authentication After Brute Force - Rule]
description = Detects a successful sign-in from a source IP that generated 20 or more failures against the same account in the preceding hour. This is a confirmed brute force success and should be treated as account compromise. Playbook PB-05 into PB-04.
search = index=azure_ad sourcetype="azure:aad:signin"\
| rename ipAddress as src_ip, userPrincipalName as user\
| eval outcome=if('status.errorCode'==0,"success","failure")\
| stats count(eval(outcome=="failure")) as failures count(eval(outcome=="success")) as successes\
        min(eval(if(outcome=="success",_time,null()))) as success_time\
        values(appDisplayName) as apps values(userAgent) as agents\
        values(location.countryOrRegion) as countries\
        by src_ip, user\
| where failures >= 20 AND successes > 0\
| eval success_time=strftime(success_time,"%F %T")\
| table success_time, user, src_ip, countries, failures, successes, apps, agents
action.correlationsearch.enabled = 1
action.correlationsearch.label = Access - Successful Authentication After Brute Force
action.correlationsearch.annotations = {"mitre_attack":["T1110.001","T1078.004"],"kill_chain_phases":["Exploitation"],"nist":["DE.CM-1"]}
action.notable = 1
action.notable.param.rule_title = Brute force SUCCESS - $user$ from $src_ip$ after $failures$ failures
action.notable.param.rule_description = $src_ip$ failed $failures$ times against $user$ then succeeded. Treat as confirmed account compromise - revoke sessions, reset password, check for persistence. Playbook PB-04.
action.notable.param.security_domain = access
action.notable.param.severity = critical
action.notable.param.nes_fields = user,src_ip
action.notable.param.drilldown_name = Post-compromise activity for $user$
action.notable.param.drilldown_search = index=o365 sourcetype="o365:management:activity" UserId="$user$" Operation IN ("New-InboxRule","Set-InboxRule","Add-MailboxPermission","Consent to application","Add member to role") | table _time, Operation, ClientIP, Parameters
action.notable.param.drilldown_earliest_offset = 86400
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":90},{"risk_object_field":"src_ip","risk_object_type":"system","risk_score":70}]
action.risk.param._risk_message = Brute force success against $user$ from $src_ip$
alert.suppress = 1
alert.suppress.fields = user,src_ip
alert.suppress.period = 12h
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = 20 * * * *
dispatch.earliest_time = -80m@m
dispatch.latest_time = -20m@m
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


[Access - MFA Push Bombing Followed By Approval - Rule]
description = Detects MFA fatigue attacks - repeated denied or timed-out MFA challenges (errorCode 500121) followed by an approval within a short window. The approval means the user gave in, so the attacker now has a session. Playbook PB-05 into PB-04.
search = index=azure_ad sourcetype="azure:aad:signin" "status.errorCode" IN (0, 500121, 50074, 50097)\
| rename userPrincipalName as user, ipAddress as src_ip\
| sort 0 user _time\
| streamstats count(eval('status.errorCode'==500121)) as denial_run reset_on_change=false by user\
| streamstats current=f last(denial_run) as prior_denials by user\
| where 'status.errorCode'==0 AND prior_denials >= 5\
| stats min(_time) as approval_time max(prior_denials) as denials\
        values(src_ip) as src_ip values(appDisplayName) as apps\
        values(location.countryOrRegion) as countries by user\
| eval approval_time=strftime(approval_time,"%F %T")\
| table approval_time, user, denials, src_ip, countries, apps
action.correlationsearch.enabled = 1
action.correlationsearch.label = Access - MFA Push Bombing Followed By Approval
action.correlationsearch.annotations = {"mitre_attack":["T1621","T1078.004"],"kill_chain_phases":["Exploitation"],"nist":["DE.CM-1","PR.AC-7"]}
action.notable = 1
action.notable.param.rule_title = MFA fatigue success - $user$ approved after $denials$ denials
action.notable.param.rule_description = $user$ denied $denials$ MFA prompts then approved one. The attacker had valid credentials and now has a session. Revoke sessions and reset the password immediately. Enable number matching if not already enforced.
action.notable.param.security_domain = access
action.notable.param.severity = critical
action.notable.param.nes_fields = user
action.notable.param.drilldown_name = Full sign-in sequence for $user$
action.notable.param.drilldown_search = index=azure_ad sourcetype="azure:aad:signin" userPrincipalName="$user$" | table _time, ipAddress, location.countryOrRegion, status.errorCode, status.failureReason, appDisplayName | sort _time
action.notable.param.drilldown_earliest_offset = 21600
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":85}]
action.risk.param._risk_message = $user$ approved MFA after $denials$ denials - probable MFA fatigue attack
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 6h
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = */30 * * * *
dispatch.earliest_time = -90m@m
dispatch.latest_time = now
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


[Access - First Time Sign-in Country For User - Rule]
description = RISK-ONLY. Detects a successful sign-in from a country the user has not authenticated from in the previous 60 days. Individually noisy due to travel and VPN, so contributes risk rather than a notable. Combine with other identity risk for escalation.
search = index=azure_ad sourcetype="azure:aad:signin" "status.errorCode"=0 earliest=-60d\
| rename userPrincipalName as user, ipAddress as src_ip, "location.countryOrRegion" as country\
| eventstats min(_time) as first_seen_in_country by user, country\
| where first_seen_in_country > relative_time(now(),"-1h") AND _time > relative_time(now(),"-1h")\
| lookup corporate_ip_ranges.csv cidr as src_ip OUTPUT description as corp_site\
| where isnull(corp_site)\
| stats values(src_ip) as src_ip values(appDisplayName) as apps values(userAgent) as agents\
        min(_time) as firstTime by user, country\
| eval firstTime=strftime(firstTime,"%F %T")\
| table firstTime, user, country, src_ip, apps, agents
action.correlationsearch.enabled = 1
action.correlationsearch.label = Access - First Time Sign-in Country For User
action.correlationsearch.annotations = {"mitre_attack":["T1078.004"],"kill_chain_phases":["Exploitation"],"nist":["DE.AE-3"]}
action.notable = 0
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":30}]
action.risk.param._risk_message = $user$ signed in from $country$ for the first time in 60 days
action.risk.param.verbose = 0
alert.suppress = 1
alert.suppress.fields = user,country
alert.suppress.period = 24h
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = 25 * * * *
dispatch.earliest_time = -60d@d
dispatch.latest_time = now
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


##############################################################################
# PB-03 · RANSOMWARE
##############################################################################

[Endpoint - Volume Shadow Copy Deletion - Rule]
description = Detects deletion of volume shadow copies or disabling of Windows recovery, a near-universal ransomware precursor executed immediately before encryption. Treat as P1 and isolate on sight. Playbook PB-03.
search = | tstats summariesonly=true allow_old_summaries=true count\
    min(_time) as firstTime max(_time) as lastTime\
    from datamodel=Endpoint.Processes\
    where Processes.process_name IN ("vssadmin.exe","wmic.exe","bcdedit.exe","wbadmin.exe","diskshadow.exe","powershell.exe","pwsh.exe")\
    by Processes.dest Processes.user Processes.process_name Processes.process Processes.parent_process_name Processes.process_id\
| rename "Processes.*" as "*"\
| eval cmd=lower(process)\
| where match(cmd,"delete\s+shadows") OR match(cmd,"shadowcopy\s+delete")\
    OR match(cmd,"resize\s+shadowstorage") OR match(cmd,"recoveryenabled\s+no")\
    OR match(cmd,"bootstatuspolicy\s+ignoreallfailures") OR match(cmd,"delete\s+catalog")\
    OR match(cmd,"win32_shadowcopy") OR match(cmd,"delete\s+systemstatebackup")\
| eval firstTime=strftime(firstTime,"%F %T"), lastTime=strftime(lastTime,"%F %T")\
| table firstTime, lastTime, dest, user, process_name, parent_process_name, process, count
action.correlationsearch.enabled = 1
action.correlationsearch.label = Endpoint - Volume Shadow Copy Deletion
action.correlationsearch.annotations = {"mitre_attack":["T1490","T1486"],"kill_chain_phases":["Actions on Objectives"],"nist":["DE.CM-4","PR.IP-4"]}
action.notable = 1
action.notable.param.rule_title = RANSOMWARE PRECURSOR - shadow copy deletion on $dest$
action.notable.param.rule_description = $user$ executed recovery-destruction command on $dest$ - $process$. Isolate the device NOW, do not wait for confirmation. Protect backups. Escalate P1 per playbook PB-03.
action.notable.param.security_domain = endpoint
action.notable.param.severity = critical
action.notable.param.nes_fields = dest,user
action.notable.param.drilldown_name = All process activity on $dest$
action.notable.param.drilldown_search = | tstats summariesonly=false count from datamodel=Endpoint.Processes where Processes.dest="$dest$" by _time Processes.user Processes.process_name Processes.process Processes.parent_process_name | rename "Processes.*" as "*" | sort _time
action.notable.param.drilldown_earliest_offset = 14400
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"dest","risk_object_type":"system","risk_score":100},{"risk_object_field":"user","risk_object_type":"user","risk_score":80}]
action.risk.param._risk_message = Shadow copy deletion on $dest$ by $user$
alert.suppress = 1
alert.suppress.fields = dest
alert.suppress.period = 1h
counttype = number of events
quantity = 0
relation = greater than
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
disabled = 1


[Endpoint - Mass File Modification Indicative Of Encryption - Rule]
description = Detects a single process modifying or renaming more than 300 files within a 5 minute window, consistent with ransomware encryption in progress. Tune the threshold against your backup agents and indexing services, which are the main false positives.
search = | tstats summariesonly=true allow_old_summaries=true count\
    from datamodel=Endpoint.Filesystem\
    where Filesystem.action IN ("modified","created","deleted")\
    by _time span=5m Filesystem.dest Filesystem.user Filesystem.process_name\
| rename "Filesystem.*" as "*"\
| where count > 300\
| lookup beacon_allowlist.csv dest as process_name OUTPUT description as known_good\
